{% extends 'base.html' %}
{% block title %}Log In — Intake{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col items-center justify-center">
  <div class="w-full">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Intake</h1>
      <p class="text-gray-500 mt-1 text-sm">Track your daily calories & protein</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-lg font-semibold text-gray-900 mb-5">Log in</h2>
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
          <input type="text" name="username" autocomplete="username" required
            class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm text-gray-900 placeholder-gray-400
                   focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition"
            placeholder="your username">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input type="password" name="password" autocomplete="current-password" required
            class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm text-gray-900 placeholder-gray-400
                   focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition"
            placeholder="••••••••">
        </div>
        {% if form.non_field_errors %}
          <p class="text-sm text-red-600">{{ form.non_field_errors.0 }}</p>
        {% endif %}
        <button type="submit"
          class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition-colors text-sm mt-1">
          Log in
        </button>
      </form>
    </div>

    <p class="text-center text-sm text-gray-500 mt-5">
      Don't have an account?
      <a href="{% url 'register' %}" class="text-orange-500 font-medium hover:text-orange-600">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
