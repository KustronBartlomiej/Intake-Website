{% extends 'base.html' %}
{% block title %}Settings — Intake{% endblock %}

{% block content %}
<div class="space-y-5">

  <div class="flex items-center justify-between">
    <a href="{% url 'home' %}" class="flex items-center gap-1 text-sm text-gray-400 hover:text-gray-700 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M15 18l-6-6 6-6" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Back
    </a>
    <h1 class="text-base font-bold text-gray-900">Settings</h1>
    <div class="w-10"></div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
    <h2 class="text-sm font-bold text-gray-700 mb-4">Daily goals</h2>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold text-orange-400 uppercase tracking-widest mb-2">Calorie goal (kcal)</label>
        <input type="number" name="kcal_goal" value="{{ profile.kcal_goal }}" min="1" required
          class="w-full rounded-xl border border-gray-200 px-4 py-3 text-lg font-bold text-gray-900
                 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-blue-400 uppercase tracking-widest mb-2">Protein goal (g)</label>
        <input type="number" name="protein_goal" value="{{ profile.protein_goal }}" min="1" required
          class="w-full rounded-xl border border-gray-200 px-4 py-3 text-lg font-bold text-gray-900
                 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition">
      </div>
      <button type="submit"
        class="w-full bg-gray-900 hover:bg-gray-700 text-white font-semibold py-3 rounded-xl transition-colors">
        Save goals
      </button>
    </form>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
    <h2 class="text-sm font-bold text-gray-700 mb-1">Account</h2>
    <p class="text-xs text-gray-400 mb-4">Logged in as <strong class="text-gray-600">{{ request.user.username }}</strong></p>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit"
        class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl transition-colors text-sm">
        Log out
      </button>
    </form>
  </div>

</div>
{% endblock %}
